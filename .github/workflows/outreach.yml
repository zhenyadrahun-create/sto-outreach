name: outreach
on:
  schedule:
    - cron: "*/15 6-15 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: outreach
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python3 outreach.py
      - name: Save
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "update" && git pull --rebase -q && git push)
