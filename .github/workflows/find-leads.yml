name: Find leads
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      city:
        description: "Місто або кілька через кому. Порожньо = за чергою з cities.txt"
        required: false
        default: ""
      batch:
        description: "Скільки міст з черги за запуск (0 = усі, ~100 міст, довго)"
        required: false
        default: "8"
      source:
        description: "Джерело"
        type: choice
        options: [osm, google]
        default: osm
      reset:
        description: "Почати базу з нуля"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: find-leads
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find clinics
        env:
          CITY: ${{ inputs.city }}
          BATCH: ${{ inputs.batch || '8' }}
          SOURCE: ${{ inputs.source || 'osm' }}
          RESET: ${{ inputs.reset || 'false' }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/find_leads.py
      - name: Commit results
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add leads.csv sites
          git diff --cached --quiet && exit 0
          git commit -m "leads update"
          git pull --rebase origin main
          git push
